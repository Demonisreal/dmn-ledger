name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go vet -tags chaos ./internal/chaos
      - run: go test ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: test vectors in WebCrypto
        run: node scripts/vectors.mjs internal/notary/testdata/vectors.json

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -short -race ./...

  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/sim" ./cmd/sim
      - name: 2000 fixed seeds
        run: '"$RUNNER_TEMP/sim" -seeds 2000 -from 0 -profile all'
      - name: 2000 new seeds
        run: |
          from=$((1000000 + GITHUB_RUN_NUMBER * 2000))
          echo "first seed $from"
          "$RUNNER_TEMP/sim" -seeds 2000 -from "$from" -profile all
      - name: crashes only
        run: '"$RUNNER_TEMP/sim" -seeds 1000 -profile crash'
      - name: session eviction
        run: '"$RUNNER_TEMP/sim" -seeds 1000 -profile evict'
      - name: leader crashes
        run: '"$RUNNER_TEMP/sim" -seeds 1000 -profile leaders'
      - name: partitions
        run: '"$RUNNER_TEMP/sim" -seeds 1000 -profile split'
      - name: five nodes
        run: '"$RUNNER_TEMP/sim" -seeds 500 -nodes 5 -profile all'

  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/sim" ./cmd/sim
      - name: no faults
        run: '"$RUNNER_TEMP/sim" -seeds 1000 -profile calm'
      - name: network faults
        run: '"$RUNNER_TEMP/sim" -seeds 1000 -profile net'
      - name: clock faults
        run: '"$RUNNER_TEMP/sim" -seeds 1000 -profile clock'

  rot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/sim" ./cmd/sim
      - name: disk corruption, 1000 fixed seeds
        run: '"$RUNNER_TEMP/sim" -seeds 1000 -from 0 -profile rot'
      - name: disk corruption, 1000 new seeds
        run: |
          from=$((1000000 + GITHUB_RUN_NUMBER * 2000))
          echo "first seed $from"
          "$RUNNER_TEMP/sim" -seeds 1000 -from "$from" -profile rot
      - name: beyond the fault model
        run: '"$RUNNER_TEMP/sim" -seeds 500 -profile beyond'

  simbug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet -tags simbug ./...
      - run: go test -tags simbug -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/state, target: FuzzApply }
          - { pkg: ./internal/state, target: FuzzApplyRaw }
          - { pkg: ./internal/state, target: FuzzReadSnapshot }
          - { pkg: ./internal/raft, target: FuzzStep }
          - { pkg: ./internal/raft, target: FuzzSchedules }
          - { pkg: ./internal/wal, target: FuzzDecodeFrame }
          - { pkg: ./internal/wal, target: FuzzOpen }
          - { pkg: ./internal/replica, target: FuzzLoadSnapshot }
          - { pkg: ./internal/replica, target: FuzzOpenDamaged }
          - { pkg: ./internal/wire, target: FuzzReadFrame }
          - { pkg: ./internal/wire, target: FuzzBody }
          - { pkg: ./internal/wire, target: FuzzMessage }
          - { pkg: ./internal/wire, target: FuzzSnapshotStream }
          - { pkg: ./internal/audit, target: FuzzDecode }
          - { pkg: ./internal/audit, target: FuzzPath }
          - { pkg: ./internal/notary, target: FuzzVerify }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz "^${{ matrix.target }}\$" -fuzztime 30s -fuzzminimizetime 1s "${{ matrix.pkg }}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags simbug
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags chaos

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
