version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - ineffassign
    - unused
    - revive
    - depguard
  settings:
    depguard:
      rules:
        deterministic:
          files:
            - "**/internal/raft/*.go"
            - "**/internal/sim/*.go"
            - "**/internal/state/*.go"
            - "**/internal/replica/*.go"
            - "**/internal/client/*.go"
            - "**/internal/workload/*.go"
            - "**/internal/wire/*.go"
            - "**/internal/audit/*.go"
            - "!$test"
          deny:
            - pkg: time
              desc: deterministic core, time comes from ticks
            - pkg: net
              desc: deterministic core, no network
            - pkg: os
              desc: deterministic core, no file system
            - pkg: sync
              desc: deterministic core, single thread
            - pkg: crypto/rand
              desc: deterministic core, randomness is passed in
        keyless:
          files:
            - "**/internal/state/*.go"
            - "**/internal/replica/*.go"
            - "**/internal/raft/*.go"
            - "**/internal/sim/*.go"
            - "**/internal/client/*.go"
            - "**/internal/workload/*.go"
            - "**/internal/audit/*.go"
            - "**/internal/oracle/*.go"
          deny:
            - pkg: crypto/ed25519
              desc: no signing key in the core, stamps are made in internal/notary
            - pkg: github.com/Demonisreal/dmn-ledger/internal/notary
              desc: no signing key in the core, stamps are made outside it
        checkers:
          files:
            - "**/internal/check/*.go"
            - "!$test"
          deny:
            - pkg: time
              desc: a seed's verdict must not depend on the machine
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
        text: "G304|G306|G115|G404"
